<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNRP — Roblox Roleplay Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
:root {
    --bg-body: #020617;
    --bg-surface: #0f172a;
    --bg-glass: rgba(15, 23, 42, 0.7);
    --bg-input: rgba(255, 255, 255, 0.05);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.1);
    --accent-primary: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.4);
    --particle-color: rgba(255, 255, 255, 0.5);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: 'Inter', sans-serif;
}
[data-theme="light"] {
    --bg-body: #f8fafc;
    --bg-surface: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.85);
    --bg-input: #f1f5f9;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: rgba(0,0,0,0.1);
    --accent-primary: #0284c7;
    --accent-glow: rgba(2,132,199,0.2);
    --particle-color: rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background-color:var(--bg-body);color:var(--text-main);font-family:var(--font-sans);overflow-x:hidden;transition:background-color 0.5s ease,color 0.3s ease;display:flex;flex-direction:column;min-height:100vh;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
.btn{padding:10px 24px;border-radius:10px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}
.btn-primary{background:var(--text-main);color:var(--bg-body);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px var(--accent-glow);}
.btn-glass{background:var(--bg-input);color:var(--text-main);border:1px solid var(--border-color);}
.btn-glass:hover{background:var(--border-color);}
.select-ui{background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-main);padding:8px 12px;border-radius:8px;outline:none;cursor:pointer;}
.reveal{opacity:0;transform:translateY(30px);transition:all 0.8s var(--ease-smooth);}
.reveal.active{opacity:1;transform:translateY(0);}
header{position:fixed;top:0;width:100%;z-index:100;background:var(--bg-glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color);padding:16px 0;}
nav{display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:900;font-size:24px;color:var(--accent-primary);}
.nav-controls{display:flex;gap:10px;align-items:center;}
#main-content{flex:1;padding-top:60px;}
.hero{min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;}
.hero h1{font-size:clamp(32px,6vw,64px);line-height:1.1;margin-bottom:20px;}
.hero p{color:var(--text-muted);max-width:600px;margin:0 auto 30px;font-size:18px;}
.inline-comment-section{max-width:650px;width:90%;margin:40px auto 0;background:var(--bg-surface);border-radius:15px;overflow:hidden;border:1px solid var(--border-color);box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:left;padding:0;}
.inline-comments-header{padding:12px 16px;border-bottom:1px solid var(--border-color);font-size:1.1rem;font-weight:600;}
.inline-comments-list{max-height:250px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
.inline-comments-input{padding:16px;border-top:1px solid var(--border-color);display:flex;gap:10px;background:var(--bg-input);}
.inline-comments-input .c-input{flex:1;background:var(--bg-surface);border:1px solid var(--border-color);padding:10px;border-radius:20px;color:var(--text-main);outline:none;}
.comment-item{display:flex;gap:12px;}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent-primary),#818cf8);display:grid;place-items:center;font-weight:bold;color:#fff;font-size:14px;}
.c-content{flex:1;}
.c-name{font-weight:600;font-size:13px;color:var(--text-muted);margin-bottom:2px;}
.c-text{font-size:14px;line-height:1.4;color:var(--text-main);}
.c-actions{display:flex;gap:15px;margin-top:5px;font-size:12px;}
.c-action-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;transition:color 0.2s;display:flex;align-items:center;gap:4px;}
.c-action-btn:hover{color:var(--accent-primary);}
.c-action-btn .material-icons{font-size:16px;}
.replies-container{border-left:2px solid var(--border-color);padding-left:10px;margin-top:10px;display:flex;flex-direction:column;gap:10px;}
.reply-form{margin-top:10px;padding:10px;border:1px solid var(--border-color);border-radius:10px;display:none;}
.reply-form.active{display:flex;gap:10px;}
.reply-form input[type="text"]{flex:1;padding:8px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-input);color:var(--text-main);}
@media (max-width:768px){
.inline-comment-section{max-width:90%;width:95%;}
.inline-comments-list{max-height:200px;}
.inline-comments-input{flex-direction:column;gap:8px;}
.inline-comments-input .c-input{width:100%;}
.inline-comments-input button.btn-primary{width:100%;}
}

footer{background:var(--bg-surface);border-top:1px solid var(--border-color);padding:40px 0 20px;margin-top:auto;text-align:center;position:relative;z-index:10;}
.footer-contacts h3{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text-main);}
.footer-contacts p{margin:8px 0;color:var(--text-muted);font-size:15px;}
.footer-contacts a{color:var(--accent-primary);text-decoration:none;transition:0.2s;}
.footer-contacts a:hover{text-decoration:underline;text-shadow:0 0 10px var(--accent-glow);}
.copyright{margin-top:30px;padding-top:20px;border-top:1px solid var(--border-color);color:var(--text-muted);font-size:13px;opacity:0.8;}

.modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.3s ease;}
</style>
</head>
<body>
<canvas id="particles" style="position: fixed; inset: 0; z-index: -1; pointer-events: none;"></canvas>

<header>
<div class="container">
    <nav>
        <div class="logo">VNRP</div>
        <div class="nav-controls">
            <select id="theme-select" class="select-ui">
                <option value="system">🌓 Auto</option>
                <option value="light">☀️ Light</option>
                <option value="dark">🌑 Dark</option>
            </select>
            <select id="lang-select" class="select-ui">
                <option value="vi">🇻🇳 VI</option>
                <option value="en">🇺🇸 EN</option>
            </select>
        </div>
    </nav>
</div>
</header>

<div id="main-content">
<section class="hero reveal active">
<div class="container">
<h1 data-i18n="heroTitle">Xây dựng câu chuyện<br>của riêng bạn</h1>
<p data-i18n="heroDesc">Roleplay đỉnh cao trên Roblox.</p>
<div style="display: flex; gap: 12px; justify-content: center;">
<a href="#" target="_blank" class="btn btn-primary">Chơi Ngay</a>
<a href="#" target="_blank" class="btn btn-primary" data-i18n="joinDiscord">Tham gia Discord</a>
<button id="btn-guide" class="btn btn-glass" data-i18n="viewWiki">▶ Xem Hướng Dẫn</button>
</div>

<!-- Bình luận -->
<div class="inline-comment-section reveal">
<div class="inline-comments-header" id="inline-comments-title">Bình luận (0)</div>
<div class="inline-comments-list" id="inline-comments-list"></div>
<div class="inline-comments-input">
<input type="text" id="c-name-input" class="c-input" placeholder="Tên của bạn...">
<input type="text" id="c-input" class="c-input" placeholder="Viết bình luận...">
<button class="btn btn-primary" onclick="postComment()">➤</button>
</div>
</div>
</div>
</section>
</div>

<footer>
<div class="container">
<div class="footer-contacts">
<h3>Contacts:</h3>
<p>Phone: <a href="tel:+840343945807">+840343945807</a></p>
<p>Email: <a href="mailto:mkhoa2102@gmail.com">mkhoa2102@gmail.com</a></p>
</div>
<div class="copyright">
Copyright by mkees
</div>
</div>
</footer>

<div class="modal-overlay" id="guide-modal">
<button class="close-modal" onclick="closeGuide()">✕</button>
<div class="modal-container">
<div class="modal-video">
<div style="text-align: center;">
<div class="play-btn">▶</div>
<p style="margin-top: 10px; color: rgba(255,255,255,0.7);">Gameplay Preview</p>
</div>
</div>
<div class="modal-comments">
<div class="comments-header">
<h3>Bình luận (Modal)</h3>
</div>
</div>
</div>
</div>

<script>
// Theme & Language
const themeSelect = document.getElementById('theme-select');
const html = document.documentElement;
function applyTheme(theme){
    const t = theme==='system'? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;
    html.setAttribute('data-theme',t);
    localStorage.setItem('vnrp_theme',theme);
}
themeSelect.addEventListener('change', e=>applyTheme(e.target.value));
applyTheme(localStorage.getItem('vnrp_theme')||'system');

const i18n = {
vi:{heroTitle:"Xây dựng câu chuyện\ncủa riêng bạn",heroDesc:"Roleplay đỉnh cao trên Roblox.",joinDiscord:"Tham gia Discord",viewWiki:"▶ Xem Hướng Dẫn",featureTitle:"Tại sao chọn VNRP?",featureSub:"Được thiết kế chuyên sâu.",feat1Title:"Nghề nghiệp",feat1Desc:"Hệ thống nhiệm vụ đa dạng.",feat2Title:"Phương tiện",feat2Desc:"Độ xe chi tiết.",feat3Title:"Nhà cửa",feat3Desc:"Mua nhà và trang trí.",commentsTitle:"Bình luận"},
en:{heroTitle:"Build Your Own\nUnique Story",heroDesc:"Top-tier Roblox Roleplay.",joinDiscord:"Join Discord",viewWiki:"▶ Watch Guide",featureTitle:"Why Choose VNRP?",featureSub:"Designed for depth.",feat1Title:"Careers",feat1Desc:"Diverse missions.",feat2Title:"Vehicles",feat2Desc:"Detailed tuning.",feat3Title:"Housing",feat3Desc:"Buy & decorate.",commentsTitle:"Comments"}
};
document.getElementById('lang-select').addEventListener('change', e=>{
    const l=e.target.value;
    document.querySelectorAll('[data-i18n]').forEach(el=>el.innerText=i18n[l][el.getAttribute('data-i18n')]||el.innerText);
});

// COMMENTS
let localComments=[];
const localLikes=JSON.parse(localStorage.getItem('vnrp_local_likes'))||{};
const localDislikes=JSON.parse(localStorage.getItem('vnrp_local_dislikes'))||{};
const cList=document.getElementById('inline-comments-list');
const cInput=document.getElementById('c-input');
const cNameInput=document.getElementById('c-name-input');
const cTitle=document.getElementById('inline-comments-title');

function getNextCommentId(){return Date.now();}

function createCommentHTML(comment){
    const likes=localLikes[comment.id]||comment.likes_count||0;
    const dislikes=localDislikes[comment.id]||comment.dislikes_count||0;
    let repliesHTML='';
    if(comment.replies&&comment.replies.length>0){
        repliesHTML=`<div class="replies-container">${comment.replies.map(r=>createCommentHTML(r)).join('')}</div>`;
    }
    return `
<div class="comment-item" id="comment-${comment.id}">
<div class="avatar">${comment.username[0]}</div>
<div class="c-content">
<div class="c-name">${comment.username} <span style="font-weight:400;color:var(--text-muted);margin-left:5px;">(${comment.time||'vừa xong'})</span></div>
<div class="c-text">${comment.content}</div>
<div class="c-actions">
<button class="c-action-btn" onclick="handleLike(${comment.id})"><span class="material-icons">thumb_up_alt</span> ${likes}</button>
<button class="c-action-btn" onclick="handleDislike(${comment.id})"><span class="material-icons">thumb_down_alt</span> ${dislikes}</button>
<button class="c-action-btn" onclick="openReplyForm(${comment.id},'${comment.username}')"><span class="material-icons">reply</span> Trả lời</button>
</div>
<div class="reply-form" id="reply-form-${comment.id}">
<input type="text" id="reply-name-${comment.id}" placeholder="Tên của bạn..." value="${localStorage.getItem('vnrp_username')||''}">
<input type="text" id="reply-input-${comment.id}" placeholder="Trả lời @${comment.username}...">
<button class="btn btn-primary" style="padding:5px 10px;" onclick="postComment(document.getElementById('reply-input-${comment.id}').value,document.getElementById('reply-name-${comment.id}').value,${comment.id})">Gửi</button>
</div>
${repliesHTML}
</div>
</div>
`;
}

function renderComments(){
    if(localComments.length===0){
        localComments=[
            {id:1,username:"Pro",content:"Server xịn!",time:"2m",likes_count:5,replies:[]},
            {id:2,username:"Newbie",content:"Xin việc sao?",time:"5m",likes_count:0,replies:[{id:3,username:"Mod",content:"Chat Discord nha!",time:"1m"}]}
        ];
    }
    const savedName=localStorage.getItem('vnrp_username');
    if(savedName)cNameInput.value=savedName;
    cTitle.innerText=`Bình luận (${localComments.length})`;
    cList.innerHTML=localComments.map(createCommentHTML).join('');
    cList.scrollTop=cList.scrollHeight;
}

function postComment(content,cName,parentId=null){
    const userContent=(content||cInput.value.trim());
    const userName=(cName||cNameInput.value.trim());
    if(!userContent||!userName){
        if(parentId===null)return alert('Vui lòng nhập cả Tên và Nội dung.');
        else return;
    }
    const newComment={id:getNextCommentId(),username:userName,content:userContent,time:'vừa xong',likes_count:0,replies:[]};
    if(parentId===null){
        localComments.push(newComment);
        cInput.value='';
    } else {
        function addReplyRecursive(comments){
            for(const c of comments){
                if(c.id===parentId){
                    c.replies.push(newComment);
                    return true;
                }
                if(c.replies && c.replies.length>0){
                    if(addReplyRecursive(c.replies)) return true;
                }
            }
            return false;
        }
        addReplyRecursive(localComments);
        document.getElementById(`reply-form-${parentId}`).classList.remove('active');
    }
    localStorage.setItem('vnrp_username',userName);
    renderComments();
}

function handleLike(id){localLikes[id]=(localLikes[id]||0)+1;localStorage.setItem('vnrp_local_likes',JSON.stringify(localLikes));renderComments();}
function handleDislike(id){localDislikes[id]=(localDislikes[id]||0)+1;localStorage.setItem('vnrp_local_dislikes',JSON.stringify(localDislikes));renderComments();}
function openReplyForm(id,name){document.querySelectorAll('.reply-form').forEach(f=>f.classList.remove('active'));document.getElementById(`reply-form-${id}`).classList.add('active');document.getElementById(`reply-input-${id}`).focus();}

// Modal guide
const guideModal=document.getElementById('guide-modal');
function closeGuide(){guideModal.style.display='none';guideModal.style.opacity=0;}
document.getElementById('btn-guide').addEventListener('click',()=>{guideModal.style.display='flex';setTimeout(()=>guideModal.style.opacity=1,10);});

// Particles (nhẹ nhàng)
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
const particles=[];
for(let i=0;i<60;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3});}
function drawParticles(){ctx.clearRect(0,0,w,h);for(const p of particles){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='var(--particle-color)';ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;}requestAnimationFrame(drawParticles);}
drawParticles();

// Reveal on scroll
function reveal(){document.querySelectorAll('.reveal').forEach(el=>{const top=el.getBoundingClientRect().top;if(top<window.innerHeight-50){el.classList.add('active');}});}
window.addEventListener('scroll',reveal);
renderComments();
</script>
</body>
</html>
